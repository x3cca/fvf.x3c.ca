name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build production site
        run: pnpm build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Build itch.io package
        run: pnpm build-itch

      - name: Upload itch.io artifact
        uses: actions/upload-artifact@v4
        with:
          name: itch-build
          path: ./fvf-decks-itch.zip
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-itch:
    name: Deploy to itch.io
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download itch.io artifact
        uses: actions/download-artifact@v4
        with:
          name: itch-build

      - name: Set up butler
        uses: remarkablegames/setup-butler@0cd7c23a08590447459b75779fc27d8a0197ed1b

      - name: Deploy browser build
        run: >-
          butler push fvf-decks-itch.zip cooldotty/fvf-decks:html5 --if-changed
          --userversion "${{ github.sha }}"
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
